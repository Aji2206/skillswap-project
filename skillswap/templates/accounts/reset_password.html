{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password | SkillSwap{% endblock %}

{% block content %}
<div class="page-wrapper" style="display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card-glass" style="width: 100%; max-width: 460px; padding: 38px 34px;">
        <div style="text-align: center; margin-bottom: 26px;">
            <div style="width: 56px; height: 56px; border-radius: 12px; background: rgba(15, 23, 42, 0.06); border: 1px solid rgba(15, 23, 42, 0.1); display: inline-flex; align-items: center; justify-content: center; color: var(--navy-900); font-size: 2.2rem; margin-bottom: 16px;">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 style="font-size: 2.4rem; font-weight: 800; color: var(--navy-900); margin-bottom: 6px;">Set New Password</h1>
            <p style="font-size: 1.45rem; color: var(--text-muted); margin: 0; line-height: 1.5;">
                Create a strong new password for your SkillSwap account.
            </p>
        </div>

        <form method="POST" action="{% url 'reset_password' %}" id="resetPasswordForm">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="id_new_password">
                    <i class="fa-solid fa-key" style="color: var(--navy-700);"></i> New Password
                </label>
                <div style="position: relative;">
                    <input 
                        type="password" 
                        name="new_password" 
                        id="id_new_password" 
                        class="form-control" 
                        placeholder="At least 8 characters" 
                        required 
                        autofocus 
                        autocomplete="new-password"
                        style="padding-right: 44px;"
                    >
                    <button type="button" class="toggle-password" data-target="id_new_password" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.5rem; padding: 4px;">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="id_confirm_password">
                    <i class="fa-solid fa-check-double" style="color: var(--navy-700);"></i> Confirm Password
                </label>
                <div style="position: relative;">
                    <input 
                        type="password" 
                        name="confirm_password" 
                        id="id_confirm_password" 
                        class="form-control" 
                        placeholder="Re-enter your new password" 
                        required 
                        autocomplete="new-password"
                        style="padding-right: 44px;"
                    >
                    <button type="button" class="toggle-password" data-target="id_confirm_password" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.5rem; padding: 4px;">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1.5rem;">
                <i class="fa-solid fa-check"></i> Reset Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 1.45rem;">
            <a href="{% url 'login' %}" style="color: var(--navy-900); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
