{% extends 'base.html' %}
{% load static %}

{% block title %}Signed Out | SkillSwap{% endblock %}

{% block content %}
<div class="page-wrapper" style="display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card-glass" style="text-align: center; max-width: 440px; width: 100%; padding: 40px 32px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--navy-800); display: inline-flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 20px;">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </div>
        <h1 style="font-size: 2.4rem; font-weight: 800; color: var(--navy-900); margin-bottom: 8px;">You Have Signed Out</h1>
        <p style="font-size: 1.45rem; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6;">
            Thank you for being part of the SkillSwap community. See you again soon for more skill exchanges!
        </p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In Again
            </a>
            <a href="{% url 'home' %}" class="btn btn-secondary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-house"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
